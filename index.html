<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jobtrix - AI Hiring for Blue-Collar Teams</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230F172A'/%3E%3Cpath d='M17.5 4L6 18H15L13.5 28L25 14H16L17.5 4Z' fill='%23F59E0B'/%3E%3Ccircle cx='24' cy='7' r='2' fill='%2338BDF8'/%3E%3C/svg%3E" />
  </head>
  <body style="margin: 0; padding: 0;">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        console.error('GLOBAL ERROR:', e.error || e.message);
        var box = document.getElementById('runtime-error-alert');
        if (!box) {
          box = document.createElement('div');
          box.id = 'runtime-error-alert';
          box.style = 'position:fixed;top:0;left:0;right:0;background:#DC2626;color:#FFF;padding:16px;z-index:9999999;font-family:sans-serif;font-size:14px;';
          document.body.appendChild(box);
        }
        box.textContent = 'Runtime Exception: ' + (e.error ? (e.error.stack || e.error.message) : e.message);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('UNHANDLED REJECTION:', e.reason);
      });
    </script>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
